[package]
name = "docconvert"
version = "0.1.0"
edition = "2021"
description = "Offline document conversion to Markdown and plain text"
license = "MIT OR Apache-2.0"

[lib]
name = "docconvert"
path = "src/lib.rs"

[[bin]]
name = "docconvert"
path = "src/main.rs"

[features]
pdf-layout = ["dep:pdfium-render"]

# Source-only delivery: user resolves current stable versions and commits Cargo.lock.
[dependencies]
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
walkdir = "2"
base64 = "0.22"
csv = "1"
encoding_rs = "0.8"
logos = "0.15"
calamine = "0.36"
lopdf = { version = "0.45", default-features = false }

pdfium-render = { version = "0.9", optional = true, default-features = false, features = ["pdfium_latest", "thread_safe"] }
pdf-extract = "0.12.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
# Unwinding is required for per-file catch_unwind containment (see implementation notes).
panic = "unwind"

# Fuzz-2026-10-04 (user-authorized upstream fix, AQ-013): local hardening of
# pdf-extract/adobe-cmap-parser hostile-input panics (dangling refs, malformed
# CMaps). Same crate versions, graceful-Err instead of expect(); see patches/.
[patch.crates-io]
pdf-extract = { path = "patches/pdf-extract" }
adobe-cmap-parser = { path = "patches/adobe-cmap-parser" }
